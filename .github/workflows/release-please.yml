name: Release

# Reads conventional commits on main and keeps a "chore(main): release x.y.z"
# pull request open with the next version and a changelog. Merging that PR
# creates the tag and release, then builds the dmg and attaches it.
#
#   fix: ...                     -> patch (0.1.0 -> 0.1.1)
#   feat: ...                    -> minor (0.1.0 -> 0.2.0)
#   feat!: ...                   -> major (minor while below 1.0.0)


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # For release-please PRs

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
