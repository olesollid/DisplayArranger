name: Build

# Builds an ad-hoc signed DisplayArranger.app and packages it in a DMG with an
# /Applications shortcut to drag it onto, plus a SHA-256 checksum file.
#  - Every push to main and every pull request: both are uploaded as a workflow artifact.
#  - Called by release-please.yml when a release is created: that workflow's
#    publish job attaches the artifact to the GitHub Release.
#  - Can also be started by hand from the Actions tab.
#
# This workflow only ever gets a read-only token: it runs the project's own build
# scripts, so it never holds permission to change the repository or its releases.
#
# Actions are pinned to full commit SHAs (the comment shows the version);
# Dependabot keeps them up to date.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Tag to build and version the app as (e.g. v1.2.0)
        type: string
        required: false
        default: ""
    outputs:
      artifact_name:
        description: Name of the uploaded artifact holding the DMG and checksum
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      APP_NAME: DisplayArranger
    outputs:
      artifact_name: ${{ steps.dmg.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Work out version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION="${RELEASE_TAG#v}"
          else
            # Last released version, as recorded by release-please.
            VERSION="$(jq -r '."."' .release-please-manifest.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Build (ad-hoc signed, universal)
        run: |
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Verify signature
        run: |
          APP="build/Build/Products/Release/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier="
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"

      - name: Create DMG and checksum
        id: dmg
        run: |
          STAGING="$RUNNER_TEMP/dmg"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$STAGING" "$OUT"
          ditto "build/Build/Products/Release/$APP_NAME.app" "$STAGING/$APP_NAME.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="$APP_NAME-$VERSION.dmg"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$OUT/$DMG"
          hdiutil verify "$OUT/$DMG"
          (cd "$OUT" && shasum -a 256 "$DMG" > "$DMG.sha256" && cat "$DMG.sha256")
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "artifact_name=$APP_NAME-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dmg.outputs.artifact_name }}
          path: ${{ env.OUT }}/*
          if-no-files-found: error
